apiVersion: v1
kind: Secret
metadata:
  name: sentinel-soc-secret
  namespace: sentinel-soc
type: Opaque
stringData:
  # Sensitive Azure and OpenAI API credentials (populate in your private environment)
  # REQUIRED: replace with a random value (>= 32 chars). The app refuses to start with a missing or placeholder key.
  #   python -c "import secrets; print(secrets.token_urlsafe(64))"
  SECRET_KEY: ""
  AZURE_CLIENT_SECRET: "YOUR_AZURE_CLIENT_SECRET"
  AZURE_OPENAI_API_KEY: "YOUR_AZURE_OPENAI_API_KEY"
  OPENAI_API_KEY: ""
  ABUSEIPDB_API_KEY: ""
  VIRUSTOTAL_API_KEY: ""
