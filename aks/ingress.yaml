apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel-soc-ingress
  namespace: sentinel-soc
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sentinel-soc-service"
spec:
  rules:
    - host: soc.sentinel-ai.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinel-soc-service
                port:
                  number: 80
