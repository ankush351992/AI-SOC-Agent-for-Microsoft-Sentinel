apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-soc-agent
  namespace: sentinel-soc
  labels:
    app: sentinel-soc-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-soc-agent
  template:
    metadata:
      labels:
        app: sentinel-soc-agent
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sentinel-soc-agent-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: sentinel-soc-agent
          image: your-acr.azurecr.io/sentinel-soc-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: sentinel-soc-agent-config
            - secretRef:
                name: sentinel-soc-agent-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
