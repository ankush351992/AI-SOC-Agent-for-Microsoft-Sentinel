apiVersion: v1
kind: Secret
metadata:
  name: sentinel-soc-agent-secrets
  namespace: sentinel-soc
type: Opaque
stringData:
  SECRET_KEY: "replace-with-a-random-256bit-secret-key"
  ADMIN_USERNAME: "soc_admin"
  ADMIN_PASSWORD: "SentinelStrongPassword2026!"
  AZURE_OPENAI_API_KEY: "your-azure-openai-key-here"
  # If using Service Principal instead of Managed Identity:
  AZURE_TENANT_ID: "00000000-0000-0000-0000-000000000000"
  AZURE_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
  AZURE_CLIENT_SECRET: "your-sp-secret-here"
  # Threat Intelligence:
  ABUSEIPDB_API_KEY: ""
  VIRUSTOTAL_API_KEY: ""
