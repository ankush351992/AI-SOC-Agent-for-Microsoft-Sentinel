apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel-soc-agent-ingress
  namespace: sentinel-soc
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Enable WebSocket connections for live investigation trails
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sentinel-soc-agent-service"
spec:
  tls:
    - hosts:
        - sentinel-agent.yourdomain.com
      secretName: sentinel-agent-tls
  rules:
    - host: sentinel-agent.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinel-soc-agent-service
                port:
                  number: 80
